paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_prefix_filenames: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  num_inference_steps: 32
  timeout_seconds: 600

  seed_mode: random
  seed: 1234

render:
  soundfont: null
  sample_rate: 44100
  gain: 1.0
  lufs: -14
  timeout_seconds: 300
  composer: Sayantan

  # WAV render backend: "fluidsynth" (default) or "vst3".
  #
  # fluidsynth — renders score.mid through a SoundFont (GeneralUser-GS.sf2).
  # vst3       — renders score.mid through one or more VST3 instruments,
  #              routed by MIDI channel (requires Pedalboard / Python).
  backend: vst3

  # VST3 routing table. Each entry maps a set of MIDI channels to a VST3
  # instrument. Channels not listed are dropped from the render.
  #
  # Notes on paths:
  #   - Some plugins (Audiolatry Grand Piano) load from the top-level .vst3
  #     bundle folder.
  #   - Others (Ample Sound) require the inner binary path with the full
  #     Contents/x86_64-win/... nesting.
  #
  # gains are per-route multipliers used when summing the mixes. They
  # compensate for the fact that different VST instruments have different
  # output levels for the same MIDI velocity. Measured peaks on
  # 2026-10-05-blue-light-on-the-wet-floor:
  #   guitar route peak = 0.2793  →  gain 0.7  →  contributes 0.196
  #   piano route peak  = 0.0606  →  gain 3.0  →  contributes 0.182
  # This brings the two roughly level in the mix. Tune by ear.
  vst3_routing:
    - channels: [0, 1]
      vst3: "C:/Program Files/Common Files/VST3/AGML.vst3/Contents/x86_64-win/AGML.vst3"
      gain: 0.9
    - channels: [2]
      vst3: "C:/Program Files/Common Files/VST3/Audiolatry/Grand Piano.vst3"
      gain: 3.0

  # MIDI program numbers per role. Only used by the FluidSynth backend.
  # 0=Acoustic Grand Piano   4=Rhodes        24=Nylon Guitar   25=Steel Guitar
  voice_programs:
    melody:         24
    ins:             0
    accompaniment:   0
    accompaniment2:  0