paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_in_folder: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  num_inference_steps: 32
  timeout_seconds: 600

  seed_mode: random
  seed: 1234

transcribe:
  provider: sheetsage2
  base_url: http://127.0.0.1:8081
  endpoint: /v1/tasks/run
  model: sheetsage2
  sample_rate: null
  timeout_seconds: 1800

render:
  sample_rate: 44100
  timeout_seconds: 300
  composer: Sayantan

  loudness:
    enabled: true
    target_lufs: -14
    true_peak_db: -1

  # Path to the sfizz CLI. Override here if it's not on PATH.
  sfizz_bin: sfizz_render

  # ---- The instrument menu ----
  #
  # Every instrument the pipeline can play, keyed by a name you choose.
  # A name is any string; a voice refers to it by that name. Add an
  # instrument here once and it is available to every song.
  #
  # An entry is:
  #   { engine: vst3,  vst3: "C:/path/to/plugin.vst3" }
  #   { engine: sfizz, sfz:  "C:/path/to/soundfont.sfz" }
  #
  # The engine names the renderer; the path is the instrument itself.
  instruments:
    # ---- VST3 instruments ----
    AGML:
      engine: vst3
      vst3: "C:/Program Files/Common Files/VST3/AGML.vst3/Contents/x86_64-win/AGML.vst3"
    "AGPL Bass":
      engine: vst3
      vst3: "C:/Program Files/Common Files/VST3/AGPL.vst3/Contents/x86_64-win/AGPL.vst3"
    "Grand Piano":
      engine: vst3
      vst3: "C:/Program Files/Common Files/VST3/Audiolatry/Grand Piano.vst3"

    # ---- Soundfonts ----
    # The "- vel XFades" variant crossfades velocity layers instead of
    # jumping between them, so soft notes are a genuinely different sample
    # rather than the same one played quieter.
    livingroom-upright-piano-micro-sfz:
      engine: sfizz
      sfz: "D:/media/soundfonts/livingroom-upright-piano-micro-sfz/KeyPleezer LivingRoom Upright - Free Micro SFZ - vel XFades.sfz"
    "LR Upright (muted)":
      engine: sfizz
      sfz: "D:/media/soundfonts/livingroom-upright-piano-micro-sfz/KeyPleezer LivingRoom Upright - Free Micro SFZ - muted - vel XFades.sfz"

    # Placeholders — replace with real SFZ paths as you collect them.
    # If a voice points at a placeholder before the path is real, the
    # render fails with "SFZ not found: PLACEHOLDER/..." which names the gap.
    "SFZ Vocal":
      engine: sfizz
      sfz: "PLACEHOLDER/Vocal.sfz"
    "SFZ Guitar":
      engine: sfizz
      sfz: "PLACEHOLDER/Guitar.sfz"
    "SFZ Bass":
      engine: sfizz
      sfz: "PLACEHOLDER/Bass.sfz"

  # ---- The house defaults ----
  #
  # Which instrument each ABC voice uses, unless a song overrides it.
  # Values are instrument names from the menu above.
  #
  # The reserved key "accompaniment" is the chord track abcjs generates
  # from "C", "G7", "Fmaj7" symbols. It has no `V:` line of its own.
  voices:
    Vocal:         AGML
    Ins:           AGML
    accompaniment: "Grand Piano"
    Bass:          "AGPL Bass"

  # Default gain per voice. Any voice not listed defaults to 1.0.
  # A song can override any of these in its render.local.yaml.
  gains:
    Vocal:         0.9
    Ins:           0.9
    accompaniment: 3.0
    Bass:          1.0

  # What to do when an ABC declares a voice with no entry in either the
  # song's overrides or `voices` above.
  #
  #   "error"     fail the render, naming the voice  (default)
  #   "fallback"  warn on stderr, then use `voice_fallback` below
  #
  # The fallback is a convenience while a song is being sketched: a new
  # voice renders immediately on a placeholder instrument instead of
  # failing the whole render. Switch to "error" once your voice set is
  # settled so a typo'd voice name fails loudly.
  voice_fallback_policy: fallback
  voice_fallback:
    engine: vst3
    vst3: "C:/Program Files/Common Files/VST3/AGML.vst3/Contents/x86_64-win/AGML.vst3"

  # Static VST3 routing table. Legacy escape hatch for setups that do not
  # use the instrument menu. Ignored whenever `voices` is non-empty.
  vst3_routing: []

  humanize:
    enabled: true
    timing_ms: 4
    velocity: 4
    chord_roll_ms: 4
    roll_order: up
    min_vel: 40
    max_vel: 115
    seed: 0

video:
  width: 1920
  height: 1080
  fps: 30
  fit: blur
  crf: 18
  preset: medium
  audio_bitrate: 192k