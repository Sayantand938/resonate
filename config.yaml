paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_prefix_filenames: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  num_inference_steps: 32
  timeout_seconds: 600

  seed_mode: random
  seed: 1234

render:
  soundfont: null
  sample_rate: 44100
  gain: 1.0
  lufs: -14
  timeout_seconds: 300
  composer: Sayantan

  # WAV render backend: "fluidsynth" (default) or "vst3".
  backend: vst3

  # VST3 routing table. Each entry maps a set of MIDI channels to a VST3
  # instrument. Channels not listed are dropped from the render.
  vst3_routing:
    - channels: [0, 1]
      vst3: "C:/Program Files/Common Files/VST3/AGML.vst3/Contents/x86_64-win/AGML.vst3"
      gain: 0.9
    - channels: [2]
      vst3: "C:/Program Files/Common Files/VST3/Audiolatry/Grand Piano.vst3"
      gain: 3.0

  # Humanize: subtle timing jitter, velocity jitter, and chord roll added
  # to the rendered MIDI before it goes to the audio backend.
  #
  # When enabled, runMidi writes score.human.mid (leaving score.mid as the
  # clean abcjs output), and runRender prefers the humanized file. Toggle
  # enabled:false to A/B against the mechanical version.
  #
  #   timing_ms       max timing jitter per note, ± ms         (5-30)
  #   velocity        max velocity jitter per note, ±          (4-15)
  #   chord_roll_ms   stagger between same-tick chord notes, ms (5-25)
  #   roll_order      "up" (low→high) or "down" (high→low)
  #   min_vel/max_vel velocity clamp range for the humanized notes
  #   seed            0 = random each run; non-zero = deterministic
  humanize:
    enabled: true
    timing_ms: 15
    velocity: 8
    chord_roll_ms: 12
    roll_order: up
    min_vel: 40
    max_vel: 115
    seed: 0

  # MIDI program numbers per role. Only used by the FluidSynth backend.
  # 0=Acoustic Grand Piano   4=Rhodes        24=Nylon Guitar   25=Steel Guitar
  voice_programs:
    melody:         24
    ins:             0
    accompaniment:   0
    accompaniment2:  0