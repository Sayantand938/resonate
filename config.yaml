paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_prefix_filenames: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  num_inference_steps: 32
  timeout_seconds: 600

  # Seed handling for YuE2.
  #   fixed   — always use `seed` below (reproducible across runs)
  #   random  — fresh random seed on every call (never reproducible)
  seed_mode: random
  seed: 1234        # unused when seed_mode is "random", kept as a fallback

render:
  soundfont: null
  sample_rate: 44100
  gain: 1.0
  lufs: -14
  timeout_seconds: 300
  composer: Sayantan

  # WAV render backend: "fluidsynth" (default) or "vst3".
  #
  # fluidsynth — renders score.mid through a SoundFont (GeneralUser-GS.sf2).
  #              Fast, no plugin loading, works with the existing pipeline.
  #              Ignores vst3_path. Honors `soundfont`, `lufs`.
  #
  # vst3       — renders score.mid through a VST3 instrument plugin.
  #              Set `vst3_path` below to the .vst3 bundle you want to use.
  #              Requires `pnpm install nvst3-host`.
  #              Ignores `soundfont` and `lufs`; the plugin's own patch
  #              determines the sound.
  backend: vst3
  vst3_path: "C:/Program Files/Common Files/VST3/Audiolatry/Grand Piano.vst3"

  # MIDI program numbers per role.
  # 0=Acoustic Grand Piano   4=Rhodes        24=Nylon Guitar   25=Steel Guitar
  # 32=Acoustic Bass        33=Fingered Bass  34=Picked Bass    48=Strings
  #
  # channels:
  #   ch 0  melody voice (V: Vocal)
  #   ch 1  ins voice    (V: Ins)
  #   ch 2  accompaniment (abcjs-generated from chord symbols)
  #   ch 3  reserved for future use
  #
  # Note: these programs are honored by the FluidSynth backend. The VST3
  # backend loads a single plugin for all channels, so programs are ignored
  # in that mode (see scripts/midi2wav-vst.mjs). A future revision can route
  # per-channel to multiple plugin instances.
  voice_programs:
    melody:         24    # V: Vocal  → Nylon String Guitar (lead)
    ins:             0    # V: Ins    → Acoustic Grand Piano (counter-melody)
    accompaniment:   0    # ch 2      → Acoustic Grand Piano
    accompaniment2:  0    # ch 3      → Acoustic Grand Piano