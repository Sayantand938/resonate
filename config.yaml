paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_prefix_filenames: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  num_inference_steps: 32
  timeout_seconds: 600

  seed_mode: random
  seed: 1234

# Transcription: `resonate transcribe` turns an existing recording
# (og_song.wav / .mp3 / .m4a / .flac / .ogg in the song folder) into
# score.abc — the same artifact the score stage produces, so midi, render
# and video are unchanged. Any source is re-encoded through ffmpeg first,
# which also repairs downloaded WAVs whose RIFF sizes are 0xFFFFFFFF.
#
# NOTE the different port. SheetSage2 must run in its own server process
# with "backend": "cpu": audio.cpp ignores the per-model "backend" key, so
# a server with a global vulkan backend fails with "encoder backend buffer
# allocation failed" on AMD hardware. See server-sheetsage.json.
transcribe:
  provider: sheetsage2
  base_url: http://127.0.0.1:8081
  endpoint: /v1/tasks/run
  model: sheetsage2

  # null keeps the source sample rate; set e.g. 48000 to force one.
  sample_rate: null

  # A 3:37 track took ~3 minutes on CPU. Generous by default.
  timeout_seconds: 1800

render:
  soundfont: null
  sample_rate: 44100
  gain: 1.0
  timeout_seconds: 300
  composer: Sayantan

  # Final loudness normalization, applied to the WAV whichever backend
  # produced it. These are the Spotify delivery targets:
  #
  #   target_lufs   integrated loudness (-14 LUFS is Spotify/YouTube)
  #   true_peak_db  true-peak ceiling, so lossy transcoding can't clip
  #
  # Reaching the target from a very dynamic mix needs some gain reduction,
  # because loudnorm limits rather than clips. Raise target_lufs towards
  # -10 for a louder, more squashed master; set enabled:false to keep the
  # raw backend level and let the streaming service do all the work.
  loudness:
    enabled: true
    target_lufs: -14
    true_peak_db: -1

  # WAV render backend: "fluidsynth" (portable GM soundfont) or "vst3"
  # (your own plugins, routed per MIDI channel below).
  #
  # This project is set up for a single user, so there is no
  # config.local.yaml — everything lives in this one file.
  backend: vst3

  # VST3 routing table (only consulted when backend: vst3). Each entry maps
  # a set of MIDI channels to a VST3 instrument; channels not listed are
  # dropped from the render.
  #
  # Channels (from the pipeline's layout):
  #   0  melody
  #   1  counter-melody (V: Ins)
  #   2  chord accompaniment
  #   3  second accompaniment channel (if abcjs splits chords)
  #
  # The vst3 path is the inner .vst3 FILE, not the outer folder. On Windows
  # that is usually:
  #   <Name>.vst3/Contents/x86_64-win/<Name>.vst3
  #
  # REPLACE THESE PATHS WITH YOUR OWN. To list every installed VST3:
  #   Get-ChildItem -Path 'C:\Program Files\Common Files\VST3' -Recurse `
  #     -Filter *.vst3 |
  #     Where-Object { $_.FullName -match 'x86_64-win' } |
  #     Select-Object -ExpandProperty FullName
  vst3_routing:
    - channels: [0, 1]
      vst3: "C:/Program Files/Common Files/VST3/AGML.vst3/Contents/x86_64-win/AGML.vst3"
      gain: 0.9
    - channels: [2, 3]
      vst3: "C:/Program Files/Common Files/VST3/Audiolatry/Grand Piano.vst3"
      gain: 3.0

  # Humanize: subtle timing drift, velocity variation, and chord roll added
  # to the rendered MIDI before it goes to the audio backend.
  #
  # When enabled, runMidi writes score.human.mid (leaving score.mid as the
  # clean abcjs output), and runRender prefers the humanized file. Toggle
  # enabled:false to A/B against the mechanical version.
  #
  # These are deliberately small. Timing moves as a bounded random walk --
  # the part pushes and pulls as a phrase -- instead of independent jitter on
  # every note, which is what reads as an unsteady beginner. Millisecond
  # values are converted with the song's own tempo, so 4 ms means 4 ms at
  # 70 BPM and at 140 BPM alike.
  #
  #   timing_ms       how far the drift wanders either way, ms     (0-15)
  #   velocity        max velocity variation per note, ±           (0-10)
  #   chord_roll_ms   stagger between same-tick chord notes, ms    (0-10)
  #   roll_order      "up" (low→high, a strum) or "down" (high→low)
  #   min_vel/max_vel velocity clamp for the humanized notes
  #   seed            0 = random each run; non-zero = deterministic
  humanize:
    enabled: true
    timing_ms: 4
    velocity: 4
    chord_roll_ms: 4
    roll_order: up
    min_vel: 40
    max_vel: 115
    seed: 0

  # MIDI program numbers per role. Only used by the FluidSynth backend.
  # 0=Acoustic Grand Piano   4=Rhodes        24=Nylon Guitar   25=Steel Guitar
  voice_programs:
    melody:         24
    ins:             0
    accompaniment:   0
    accompaniment2:  0

# Video: `resonate video` pairs song.wav with the still image in the song
# folder (thumbnail.png / .jpg / .jpeg / .webp) and writes song.mp4.
# Songs without a thumbnail are skipped with a warning, never guessed at.
video:
  width: 1920
  height: 1080
  fps: 30

  # How a thumbnail that isn't already 16:9 is fitted to the frame:
  #   blur  blurred copy of the art fills the frame behind it (default)
  #   pad   centred on a black frame, nothing cropped
  #   crop  scaled to cover, overhang trimmed
  fit: blur

  # x264 quality and speed. Lower crf = better and bigger (18 is near-lossless
  # for a still image); slower presets compress better at the same quality.
  crf: 18
  preset: medium
  audio_bitrate: 192k