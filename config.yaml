paths:
  songs_dir: songs

api:
  base_url: https://api.aicredits.in/v1

lyrics:
  planner_model: openai/gpt-5.6-luna
  planner_prompt_file: src/song/lyrics/prompts/planner.md
  planner_temperature: 1.0

  writer_model: openai/gpt-5.6-luna
  writer_prompt_file: src/song/lyrics/prompts/writer.md
  writer_temperature: 0.9
  max_tokens: 4000

  save_plan: true
  date_prefix_filenames: true

score:
  provider: yue2
  base_url: http://127.0.0.1:8080
  endpoint: /v1/tasks/run
  model: yue2-music
  cot: full
  stop_after: abc
  seed: 1234
  num_inference_steps: 32
  timeout_seconds: 600

render:
  soundfont: null
  sample_rate: 44100
  gain: 1.0
  lufs: -14
  timeout_seconds: 300
  composer: Sayantan

  # MIDI engine: "abcjs" (in-process, default) or "abc2midi" (external binary).
  # abc2midi is more reliable for ABCs with named voices; abcjs is more
  # forgiving of ABC syntax. If abc2midi fails, the pipeline automatically
  # falls back to abcjs.
  abc_engine: abcjs
  abc2midi_path: "C:/Program Files/abcmidi/abc2midi.exe"

  # MIDI program numbers per role. See General MIDI spec for the full list.
  # 0=Acoustic Grand Piano   4=Rhodes        24=Nylon Guitar   25=Steel Guitar
  # 32=Acoustic Bass        33=Fingered Bass  34=Picked Bass    48=Strings
  voice_programs:
    melody: 24    # V: Vocal  → Nylon String Guitar
    ins:    24    # V: Ins    → Nylon String Guitar
    chords: 0     # auto-generated chord bed → Acoustic Grand Piano